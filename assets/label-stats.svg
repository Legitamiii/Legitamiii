<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="// stats">
<defs>
<linearGradient id="l" x1="40" x2="505" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset="1" stop-color="#00f7ff"/></linearGradient>
<linearGradient id="r" x1="695" x2="1160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
text{font:700 27px ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,Menlo,monospace}
.dot{animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:0}20%,80%{opacity:1}}
</style>
<rect x="40" y="31" width="465" height="2" fill="url(#l)"/>
<rect x="695" y="31" width="465" height="2" fill="url(#r)"/>
<circle class="dot" cy="32" r="3.5" fill="#fff"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="60;505"/></circle>
<circle class="dot" cy="32" r="3.5" fill="#fff"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="695;1140"/></circle>
<text x="535" y="41" textLength="130" lengthAdjust="spacing" fill="#00f7ff" filter="url(#glow)" opacity=".9">// stats</text>
<text x="535" y="41" textLength="130" lengthAdjust="spacing" fill="#fff">// stats</text>
</svg>
